theme:
  preset: default

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h

          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: Greenville, North Carolina, United States
            units: imperial
            hour-format: 12h

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Sites
                links:
                  - title: cortech.online
                    url: https://cortech.online
                  - title: dmarc.mx
                    url: https://dmarc.mx
                  - title: donthype.me
                    url: https://donthype.me
                  - title: q-r.contact
                    url: https://q-r.contact
              - title: Tools
                links:
                  - title: GitHub
                    url: https://github.com/schmug
                  - title: Cloudflare
                    url: https://dash.cloudflare.com

          - type: releases
            cache: 1d
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing

  - name: Infra
    columns:
      - size: small
        widgets:
          - type: monitor
            cache: 5m
            title: Sites
            sites:
              - title: dmarc.mx
                url: https://dmarc.mx
              - title: donthype.me
                url: https://donthype.me
              - title: apartment-stager
                url: https://apartment-stager.pages.dev
              - title: q-r.contact
                url: https://q-r.contact

      - size: full
        widgets:
          - type: repository
            repository: schmug/dmarcheck

          - type: repository
            repository: schmug/donthype-me

          - type: repository
            repository: schmug/apartment-stager

          - type: repository
            repository: schmug/qr-me

      - size: small
        widgets:
          - type: releases
            cache: 1d
            repositories:
              - schmug/dmarcheck
              - schmug/donthype-me
              - schmug/apartment-stager
              - schmug/qr-me

  - name: Pulse
    columns:
      - size: small
        widgets:
          - type: rss
            limit: 10
            collapse-after: 3
            cache: 3h
            # TODO: replace these with feeds you actually want
            feeds:
              - url: https://hnrss.org/frontpage
                title: HN front page (placeholder)

      - size: full
        widgets:
          - type: videos
            # TODO: replace with your preferred YouTube channel IDs
            # Find IDs at: https://www.youtube.com/account_advanced (or via View Source on a channel page, search for "channelId")
            channels:
              - UCsBjURrPoezykLs9EqgamOA  # Fireship (placeholder)
              - UCXuqSBlHAE6Xw-yeJA0Tunw  # Linus Tech Tips (placeholder)

          - type: group
            widgets:
              - type: reddit
                # TODO: replace with a subreddit you follow
                subreddit: selfhosted
                show-thumbnails: true
              - type: reddit
                # TODO: replace with a subreddit you follow
                subreddit: technology
                show-thumbnails: true

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Replace me
                links:
                  - title: Add your links here
                    url: https://example.com
